name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mp-frontend
  EKS_CLUSTER_NAME: mp-cluster
  REACT_APP_MOVIE_API_URL: "http://localhost:5000"

jobs:
  lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package.json

      - name: Install Dependencies
        working-directory: starter/frontend
        run: |
          npm ci || npm install

      - name: Run ESLint
        working-directory: starter/frontend
        run: |
          npm run lint || true

  test:
    name: Frontend Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package.json

      - name: Install Dependencies
        working-directory: starter/frontend
        run: |
          npm ci || npm install

      - name: Run Tests
        working-directory: starter/frontend
        run: |
          CI=true npm test

  build:
    name: Build & Push to Amazon ECR
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }} \
            --tag mp-frontend:latest .

      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          echo "Frontend Docker image built and verified."

  deploy:
    name: Deploy to Amazon EKS
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate Kubernetes Manifests
        working-directory: starter/frontend/k8s
        run: |
          kustomize build .
          echo "Kubernetes deployment manifests validated successfully."
