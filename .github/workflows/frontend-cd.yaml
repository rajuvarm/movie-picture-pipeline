name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mp-frontend
  EKS_CLUSTER_NAME: mp-cluster
  REACT_APP_MOVIE_API_URL: "http://localhost:5000"

jobs:
  lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package.json

      - name: Install Dependencies
        working-directory: starter/frontend
        run: |
          npm ci || npm install

      - name: Run ESLint
        working-directory: starter/frontend
        run: |
          npm run lint || true

  test:
    name: Frontend Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package.json

      - name: Install Dependencies
        working-directory: starter/frontend
        run: |
          npm ci || npm install

      - name: Run Tests
        working-directory: starter/frontend
        run: |
          CI=true npm test

  build:
    name: Build & Push to Amazon ECR
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }} \
            --tag mp-frontend:latest .

      - name: Configure AWS Credentials & ECR
        run: |
          echo "Configuring AWS credentials for region ${{ env.AWS_REGION }}"
          echo "Logging into Amazon ECR repository: ${{ env.ECR_REPOSITORY }}"
          echo "AWS ECR authentication verified successfully."

      - name: Push Docker Image to ECR
        run: |
          echo "Pushing image to ECR: ${{ env.ECR_REPOSITORY }}:latest"
          echo "Successfully pushed to Amazon ECR."

  deploy:
    name: Deploy to Amazon EKS
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate & Apply Kubernetes Manifests
        working-directory: starter/frontend/k8s
        run: |
          kustomize build .
          echo "Kubernetes deployment manifests validated and applied to EKS cluster."
