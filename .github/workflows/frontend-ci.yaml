build:
    name: Frontend Application & Docker Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: starter/frontend
        run: |
          npm ci || npm install

      - name: Build React Production Bundle
        working-directory: starter/frontend
        run: |
          REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }} npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }} \
            --tag mp-frontend:latest .
